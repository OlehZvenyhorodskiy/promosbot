[project]
name = "belgium-promos-bot"
version = "1.0.0"
description = "Belgian Supermarkets Promo Tracker Telegram Bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31.0",
    "aiohttp>=3.14.0",
    "aiosqlite>=0.22.0",
    "beautifulsoup4>=4.15.0",
    "apscheduler>=3.11.0",
    "pydantic>=2.13.0",
    "certifi>=2026.0.0",
    "playwright>=1.55.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
